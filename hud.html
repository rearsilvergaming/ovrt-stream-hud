<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Twitch Chat HUD</title>

<style>
:root {
    --bg: rgba(18,20,24,0.96);
    --panel: rgba(28,30,36,0.98);
    --border: rgba(255,255,255,0.08);
    --text: rgba(255,255,255,0.9);
}

html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
}

.container {
    position: relative;
    height: 100vh;
    width: 100%;
    background: var(--bg);
    backdrop-filter: blur(14px);
    border-radius: 14px;
    overflow: hidden;
}

.topbar {
    height: 36px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px;
    font-size: 13px;
}

.section {
    height: calc(100vh - 36px);
}

iframe {
    width: 100%;
    height: 100%;
    border: none;
}

/* Side Drawer */

.drawer {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: 260px;
    background: var(--panel);
    border-left: 1px solid var(--border);
    padding: 16px;
    transform: translateX(100%);
    transition: transform 0.25s ease;
    z-index: 10;
}

.drawer.open {
    transform: translateX(0);
}

.tab {
    position: absolute;
    right: 0;
    top: 80px;
    width: 26px;
    height: 60px;
    background: var(--panel);
    border-left: 1px solid var(--border);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    border-radius: 8px 0 0 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 11;
    font-size: 14px;
}

label {
    font-size: 12px;
    opacity: 0.75;
    margin-top: 14px;
    display: block;
    color: var(--text);
}


input[type=range], select {
    width: 100%;
    margin-top: 6px;
}

select {
    background: rgba(16,18,24,0.95);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 8px;
    border-radius: 8px;
}


button {
    width: 100%;
    margin-top: 18px;
    padding: 8px;
    background: #1f232c;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: white;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="container">

    <div class="topbar">
        <span>Twitch Chat HUD</span>
    </div>

    <div class="section">
        <iframe id="chatFrame"></iframe>
    </div>

    <div class="tab" onclick="toggleDrawer()">⚙</div>

    <div class="drawer" id="drawer">

        <label>Anchor</label>
        <select id="anchor">
            <option value="0">World</option>
            <option value="1">Head</option>
            <option value="2">Right Hand</option>
            <option value="3">Left Hand</option>
        </select>

        <label>Size</label>
        <input id="size" type="range" min="0.2" max="1.2" step="0.05" value="0.35">

        <label>Opacity</label>
        <input id="opacity" type="range" min="0.2" max="1" step="0.05" value="0.9">

        <label>Curvature</label>
        <input id="curve" type="range" min="0" max="1" step="0.05" value="0">

        <label>Framerate</label>
        <input id="fps" type="range" min="15" max="60" step="5" value="30">

        <button onclick="logout()">Logout</button>

        <div style="margin-top:12px; font-size:11px; opacity:0.5;">
            Developed by RearSilver
        </div>

    </div>

</div>

<script src="https://rearsilvergaming.github.io/ovrt-stream-hud/ovrt-helper.js"></script>

<script>
const API = new OVRT({ function_queue: true });
let Overlay = null;

// Set proper window title
window.addEventListener("api-ready", function () {

    API.setCurrentBrowserTitle("Twitch Chat HUD");

    API.getUniqueID().then(uid => {
        if (uid !== -1) {
            Overlay = new OVRTOverlay(uid);
        }
    });
});

// Load chat (delegate Twitch embedding to chat.html)
const params = new URLSearchParams(window.location.search);
const channel = params.get("channel");

if (channel) {
    document.getElementById("chatFrame").src =
        "https://rearsilvergaming.github.io/ovrt-stream-hud/chat.html?channel=" +
        encodeURIComponent(channel);
}


// Drawer toggle
function toggleDrawer() {
    document.getElementById("drawer").classList.toggle("open");
}

// Live control wiring
document.getElementById("anchor").onchange = e => {
    if (Overlay) Overlay.setAttachedDevice(parseInt(e.target.value));
};

document.getElementById("size").oninput = e => {
    if (Overlay) Overlay.setSize(parseFloat(e.target.value));
};

document.getElementById("opacity").oninput = e => {
    if (Overlay) Overlay.setOpacity(parseFloat(e.target.value));
};

document.getElementById("curve").oninput = e => {
    if (Overlay) Overlay.setCurve(parseFloat(e.target.value));
};

document.getElementById("fps").oninput = e => {
    if (Overlay) Overlay.setFramerate(parseInt(e.target.value));
};

// Logout clears saved channel
function logout() {
    localStorage.removeItem("twitchChannel");
    alert("Channel cleared. Close and reopen HUD.");
}
</script>

</body>
</html>
