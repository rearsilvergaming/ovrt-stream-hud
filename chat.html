<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>RearSilver Chat</title>

<style>
body {
    margin: 0;
    background: #0f1115;
}
iframe {
    width: 100%;
    height: 100vh;
    border: none;
}
</style>
</head>
<body>

<iframe id="chatFrame"></iframe>

<script>
const params = new URLSearchParams(window.location.search);
const channel = params.get("channel");

if (channel) {
    document.getElementById("chatFrame").src =
        "https://www.twitch.tv/embed/" + channel +
        "/chat?parent=" + window.location.hostname +
        "&darkpopout";
}
</script>

</body>
</html>
